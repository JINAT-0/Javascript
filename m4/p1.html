<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <h1>JavaScript Math Object</h1>
    <p>The JavaScript Math object allows you to perform mathematical tasks.</p>
    <p id="ren1"></p>
    <p id="ren2"></p>
    <p id="ren3"></p>
    <p id="ren4"></p>
    <p id="ren5"></p>
    <p id="ren6"></p>
    <p id="ren7"></p>
    <p id="ren8"></p>
    <p id="ren9"></p>
    <p id="ren10"></p>
    <p id="ren11"></p>
    <script>
    
        document.getElementById("ren1").innerHTML=Math.PI;
        document.getElementById("ren2").innerHTML=Math.ceil(4.9);
        document.getElementById("ren3").innerHTML=Math.sign(-34);
        document.getElementById("ren4").innerHTML=Math.pow(4,2);
        document.getElementById("ren5").innerHTML=Math.sqrt(64);
        document.getElementById("ren6").innerHTML=Math.min(64,1,65,3,2,7,8,9,3,0);
        document.getElementById("ren7").innerHTML=Math.max(64,1,65,3,2,79,8,9,3,0);
        document.getElementById("ren8").innerHTML=Math.random();
        document.getElementById("ren9").innerHTML=Math.floor(Math.random()*100);
        document.getElementById("ren10").innerHTML=Math.floor();
    </script> 
</body>
</html>
