<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript HTML DOM</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Doloribus, vero.</p>
    <p class="rey">Finding HTML Elements by Class Name.</p>
    <p class="rey">Hello World!</p>
    <p class="rey">This example demonstrates </p>
    <p id="ren"></p>
    <script>
        const a=document.getElementsByClassName("rey");
        document.getElementById("ren").innerHTML=a[0].innerHTML;
    </script>
</body>
</html>
