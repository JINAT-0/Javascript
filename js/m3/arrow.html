<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Arrow Functions</h1>
    <p id="ren"></p>
    <script>
        const a=(x,y)=>x*y;
        let j=a(5,4);
        const add=function(x,y){return x+y;}
        let res=add(10,20);
        document.getElementById("ren").innerHTML=j+"<br>"+res;
    </script>
</body>
</html>
