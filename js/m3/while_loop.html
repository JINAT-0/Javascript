<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Loops</h1>
    <h4>The While Loop</h4>
    <p id="ren"></p>
    <script>
        let text="";
        let i=0;
        while(i<=10){
            text+="the num    is   " + i+ "<br>";
           
            i++
        }
        document.getElementById("ren").innerHTML=text;
    </script>
</body>
</html>
