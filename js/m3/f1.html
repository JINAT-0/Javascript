<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Functions</h1>
    <p id="ren"></p>
    <script>
        function abc(){
            return "hey there , this is me jinat";
        }
        function add(x,y){
            return x+y;
        }
       
        function sub(x,y){
            return x-y;
        }
        let a=abc();
        let b=add(10,20);
        let p=sub(50,25);
        document.getElementById("ren").innerHTML=a+"<br>"+b+"<br>"+p;
    </script>

</body>
</html>
